<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>충북 하천 홍수 모니터</title>
  <style>
    :root{font-family:Inter,"Noto Sans KR",system-ui,sans-serif;color:#183127;background:#eef4f0}*{box-sizing:border-box}body{margin:0}.shell{max-width:1280px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:20px}h1{margin:0;font-size:28px}.muted{color:#6b7c74}.live{background:#daf3e3;color:#17603a;padding:7px 11px;border-radius:999px;font-weight:700}.toolbar,.panel,.alert-panel{background:#fff;border:1px solid #dfe9e3;border-radius:15px;padding:16px;box-shadow:0 8px 25px #183d2812}.toolbar{display:flex;gap:10px;margin-bottom:16px}select,input,button{height:42px;border:1px solid #cddbd3;border-radius:9px;padding:0 12px;background:#fff}input{flex:1}button{background:#176b43;color:#fff;border:0;font-weight:700;cursor:pointer}.secondary{background:#fff;color:#176b43;border:1px solid #91b9a2}.danger{background:#c43d3d}.grid{display:grid;grid-template-columns:minmax(410px,1.15fr) minmax(360px,.85fr);gap:16px}.table-wrap{overflow:auto;max-height:680px}table{width:100%;border-collapse:collapse;font-size:14px}th{position:sticky;top:0;background:#f3f7f5;text-align:left;padding:11px 9px}td{padding:11px 9px;border-top:1px solid #e5ece8}tr[data-code]{cursor:pointer}tr[data-code]:hover,tr.selected{background:#edf8f1}.mock-row{background:#fff8e7}.risk{font-weight:800}.관심{color:#3272bf}.주의{color:#bc750d}.경계{color:#d24c20}.심각{color:#be1e37}.현재{color:#288454}.detail h2{margin-top:0}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.metric{background:#f3f7f5;border-radius:10px;padding:12px}.metric b{display:block;font-size:21px;margin-top:5px}.thresholds{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:16px 0}.threshold{padding:9px 5px;text-align:center;background:#f5f5f5;border-radius:8px;font-size:12px}.threshold b{display:block;font-size:15px;margin-top:4px}.rain-list{max-height:270px;overflow:auto}.rain-row{display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #e8efeb}.mock-actions{display:flex;gap:8px;margin-top:14px}.empty{padding:50px 15px;text-align:center;color:#728078}.error{background:#fff0f0;color:#a22929;padding:12px;border-radius:9px}.alert-panel{margin-top:16px;display:flex;align-items:center;gap:16px;min-height:112px}.alert-icon{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#ffe3dc;color:#c33b25;font-size:22px;flex:none}.latest-alert{flex:1}.latest-alert strong{font-size:17px}.alert-meta{margin-top:5px;color:#556b61}.pipeline-panel{margin-top:12px}.pipeline-head{display:flex;justify-content:space-between;align-items:center}.pipeline-body{display:flex;gap:12px;align-items:center;margin-top:10px}.stage{background:#e8f0ff;color:#28549c;border-radius:999px;padding:6px 10px;font-weight:800;font-size:12px}.stage.COMPLETED{background:#daf3e3;color:#17603a}.stage.FAILED{background:#ffe0e0;color:#a22929}.pipeline-copy{flex:1}.pipeline-copy a{color:#176b43;font-weight:800}.progress-track{height:8px;background:#e7eee9;border-radius:999px;overflow:hidden;margin-top:9px}.progress-fill{height:100%;background:#21875a;transition:width .4s}.modal{position:fixed;inset:0;background:#0f2018a6;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.open{display:flex}.modal-card{background:white;width:min(900px,100%);max-height:86vh;border-radius:16px;padding:20px;overflow:auto}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal-head button{background:#eef4f0;color:#183127}.alert-item{padding:15px 3px;border-top:1px solid #e3ebe6}.alert-item:first-child{border-top:0}.job-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.job-summary div{background:#f3f7f5;border-radius:9px;padding:10px}.job-summary b{display:block;margin-top:4px}.log-tabs{display:flex;gap:7px;margin-top:14px}.log-tabs button.active{background:#176b43;color:#fff}.log-view{margin:10px 0;background:#101915;color:#d7eadf;border-radius:10px;padding:14px;min-height:250px;max-height:370px;overflow:auto;white-space:pre-wrap;font:12px/1.55 ui-monospace,SFMono-Regular,monospace}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.step{padding:7px;border-radius:7px;background:#edf2ef;font-size:12px}.step.done{background:#daf3e3}.step.active{background:#dce9ff;color:#234f98;font-weight:800}@media(max-width:850px){.grid{grid-template-columns:1fr}.shell{padding:16px}header{align-items:start;flex-direction:column}.thresholds,.job-summary{grid-template-columns:repeat(2,1fr)}.alert-panel{align-items:flex-start;flex-wrap:wrap}}
    .delivery{display:inline-block;margin-left:8px;padding:5px 9px;border-radius:7px;color:#fff;font-size:12px;font-weight:800}.delivery.send{background:#2563c7}.delivery.skip{background:#c43d3d}
    #pipelineStatus{display:flex;flex-direction:column;align-items:stretch;gap:10px}.pipeline-job{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid #e0e9e4;border-radius:11px;background:#fbfdfc}.pipeline-job+.pipeline-job{margin-top:0}
  </style>
</head>
<body>
<main class="shell">
  <header><div><h1>충북 하천 홍수 모니터</h1><div class="muted">하천 관측소별 수위·위험기준과 향후 24시간 강수예보</div></div><span id="mode" class="live">데이터 불러오는 중</span></header>
  <section class="toolbar"><select id="district"><option value="">충북 전체</option><option>청주시</option><option>충주시</option><option>제천시</option><option>단양군</option><option>괴산군</option><option>음성군</option><option>진천군</option><option>증평군</option><option>보은군</option><option>옥천군</option><option>영동군</option></select><input id="search" placeholder="관측소명 또는 주소 검색"><button id="reload">새로고침</button></section>
  <div class="grid"><section class="panel"><div id="summary" class="muted"></div><div class="table-wrap"><table><thead><tr><th>관측소</th><th>현재 수위</th><th>위험등급</th><th>관측시각</th></tr></thead><tbody id="stations"></tbody></table></div></section><aside id="detail" class="panel detail"><div class="empty">왼쪽 목록에서 하천 관측소를 선택하세요.</div></aside></div>
  <section class="alert-panel"><div class="alert-icon">!</div><div id="latestAlert" class="latest-alert"><strong>트리거 발생 알림</strong><div class="alert-meta">아직 발생한 알림이 없습니다.</div></div><button class="secondary" id="showAlerts">목록보기</button></section>
  <section class="panel pipeline-panel"><div class="pipeline-head"><strong>영상 제작 파이프라인</strong><span class="muted">2초마다 상태 갱신</span></div><div id="pipelineStatus" class="pipeline-body"><span class="muted">아직 영상 제작 작업이 없습니다.</span></div></section>
</main>
<div class="modal" id="alertModal"><div class="modal-card"><div class="modal-head"><h2>트리거 알림 목록</h2><button id="closeModal">닫기</button></div><div id="alertList"></div></div></div>
<div class="modal" id="jobModal"><div class="modal-card"><div class="modal-head"><h2 id="jobTitle">영상 제작 상세</h2><button id="closeJobModal">닫기</button></div><div id="jobDetail"></div><div class="log-tabs"><button data-log="workflow" class="secondary active">전체</button><button data-log="base_render" class="secondary">디지털 트윈</button><button data-log="composition" class="secondary">영상 합성</button><button id="copyLog" class="secondary">로그 복사</button></div><pre id="jobLog" class="log-view">로그를 불러오는 중입니다…</pre></div></div>
<script>
const $=s=>document.querySelector(s),stationsEl=$('#stations'),detailEl=$('#detail');let stations=[],alerts=[],latestJob=null,openJobId=null,logSource='workflow',logTimer=null,pipelineTimer=null,logOffsets={},logBuffers={};
const fmtTime=v=>v?new Date(v).toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'}):'-';
const value=v=>v==null?'미제공':`${Number(v).toFixed(2)}m`;
const isMock=code=>code.startsWith('MOCK-');
const riskLabel=v=>({NORMAL:'현재',ATTENTION:'관심',CAUTION:'주의',ALERT:'경계',SERIOUS:'심각'}[v]||v);
async function loadStations(){try{$('#mode').textContent='실제 API 연결';const q=$('#district').value?`?district=${encodeURIComponent($('#district').value)}`:'';const r=await fetch('/api/stations'+q);if(!r.ok)throw new Error(await r.text());stations=await r.json();renderList();}catch(e){stationsEl.innerHTML=`<tr><td colspan="4"><div class="error">${e.message}</div></td></tr>`;$('#mode').textContent='API 연결 오류'}}
function renderList(){const term=$('#search').value.trim().toLowerCase(),filtered=stations.filter(s=>(s.stationName+' '+s.address).toLowerCase().includes(term));$('#summary').textContent=`관측소 ${filtered.length}개 · 상단 4개는 트리거 검증용 mock`;stationsEl.innerHTML=filtered.map(s=>`<tr data-code="${s.stationCode}" class="${isMock(s.stationCode)?'mock-row':''}"><td><b>${s.stationName}</b>${isMock(s.stationCode)?' <small>TEST</small>':''}<br><small class="muted">${s.address}</small></td><td>${value(s.currentWaterLevel)}</td><td><span class="risk ${s.riskLevel}">${s.riskLevel}</span></td><td>${fmtTime(s.observedAt)}</td></tr>`).join('');stationsEl.querySelectorAll('tr').forEach(tr=>tr.onclick=()=>loadDetail(tr.dataset.code,tr));}
async function loadDetail(code,row){document.querySelectorAll('tr.selected').forEach(x=>x.classList.remove('selected'));if(row)row.classList.add('selected');detailEl.innerHTML='<div class="empty">수위와 단기예보를 조회 중입니다…</div>';try{const r=await fetch('/api/stations/'+code);if(!r.ok)throw new Error(await r.text());renderDetail(await r.json());}catch(e){detailEl.innerHTML=`<div class="error">${e.message}</div>`}}
function renderDetail(d){const s=d.station,t=s.thresholds,r=d.rainfall,interactive=['MOCK-003','MOCK-004','MOCK-005'].includes(s.stationCode);detailEl.innerHTML=`<h2>${s.stationName}</h2><p class="muted">${s.address}<br>관측소 ${s.stationCode} · 기상격자 (${s.nx}, ${s.ny})</p><div class="metrics"><div class="metric">현재 수위<b>${value(s.currentWaterLevel)}</b></div><div class="metric">현재 위험등급<b class="risk ${s.riskLevel}">${s.riskLevel}</b></div><div class="metric">24시간 예상강수<b>${r.accumulatedMillimeters.toFixed(1)}mm</b></div><div class="metric">예보 발표시각<b style="font-size:14px">${fmtTime(r.issuedAt)}</b></div></div><h3>위험 단계 기준수위</h3><div class="thresholds"><div class="threshold">관심<b>${value(t.attention)}</b></div><div class="threshold">주의<b>${value(t.caution)}</b></div><div class="threshold">경계<b>${value(t.alert)}</b></div><div class="threshold">심각<b>${value(t.serious)}</b></div></div><h3>시간대별 강수예보</h3><div class="rain-list">${r.hourly.map(h=>`<div class="rain-row"><span>${fmtTime(h.forecastAt)}</span><b>${h.rawValue}</b></div>`).join('')}</div>${interactive?`<div class="mock-actions"><button class="danger" onclick="changeMock('${s.stationCode}','trigger')">트리거발생</button><button class="secondary" onclick="changeMock('${s.stationCode}','normal-return')">정상Return</button></div>`:''}`}
async function changeMock(code,action){const r=await fetch(`/api/stations/${code}/${action}`,{method:'POST'});if(!r.ok)throw new Error(await r.text());await loadStations();renderDetail(await r.json());await loadAlerts();if(action==='trigger')startPipelinePolling();}
function deliveryBadge(a){return a.productionRequested?'<span class="delivery send">영상 제작 후 송신</span>':'<span class="delivery skip">영상 제작 하지 않음</span>'}
function alertHtml(a){const risk=riskLabel(a.riskLevel);return `<div class="alert-item"><strong>${a.stationName}</strong> · <span class="risk ${risk}">${risk}</span>${deliveryBadge(a)}<div class="alert-meta">${a.address}, 관측소 ${a.stationCode}, 기상격자 (${a.nx}, ${a.ny})<br>예상 강수 ${Number(a.forecastRainfallMm).toFixed(1)}mm · ${fmtTime(a.triggeredAt)}<br>${a.productionDecision||''}</div></div>`}
async function loadAlerts(){const r=await fetch('/api/alerts');alerts=await r.json();const latest=alerts[0];$('#latestAlert').innerHTML=latest?`<strong>${latest.stationName} 트리거 발생</strong>${deliveryBadge(latest)}<div class="alert-meta">${latest.address}, 관측소 ${latest.stationCode}, 기상격자 (${latest.nx}, ${latest.ny}) · ${riskLabel(latest.riskLevel)} · 예상 강수 ${latest.forecastRainfallMm.toFixed(1)}mm · ${fmtTime(latest.triggeredAt)}<br>${latest.productionDecision||''}</div>`:'<strong>트리거 발생 알림</strong><div class="alert-meta">아직 발생한 알림이 없습니다.</div>';$('#alertList').innerHTML=alerts.length?alerts.map(alertHtml).join(''):'<div class="empty">알림이 없습니다.</div>'}
const terminal=j=>j&&['COMPLETED','FAILED'].includes(j.status);
function pipelineCard(j){return `<div class="pipeline-job"><span class="stage ${j.status}">${j.progress}%</span><div class="pipeline-copy"><strong>${j.alert.stationName}</strong> · ${j.message}<div class="alert-meta">농경지 ${j.alert.locationName} · 현재 단계 ${j.currentStage} · 저장 폴더 ${j.storageName} · 갱신 ${fmtTime(j.updatedAt)}${j.error?` · 오류: ${j.error}`:''}${j.mediaUrl?` · <a href="${j.mediaUrl}" target="_blank">완성 영상 열기</a>`:''}</div><div class="progress-track"><div class="progress-fill" style="width:${j.progress}%"></div></div></div><button class="secondary" onclick="openJob('${j.id}')">상세보기</button></div>`}
async function loadPipeline(){try{const r=await fetch('/api/production-jobs');if(!r.ok)throw new Error(await r.text());const jobs=await r.json(),active=jobs.filter(x=>!terminal(x)),visible=active.length?active:(jobs.length?[jobs[0]]:[]);latestJob=visible[0]||null;$('#pipelineStatus').innerHTML=visible.length?visible.map(pipelineCard).join(''):'<span class="muted">아직 영상 제작 작업이 없습니다.</span>';return active.length===0}catch(e){if(!terminal(latestJob))$('#pipelineStatus').innerHTML=`<div class="error">${e.message}</div>`;return terminal(latestJob)}}
async function pollPipeline(){pipelineTimer=null;const done=await loadPipeline();if(!done)pipelineTimer=setTimeout(pollPipeline,2000)}
function startPipelinePolling(){if(pipelineTimer)clearTimeout(pipelineTimer);pipelineTimer=setTimeout(pollPipeline,250)}
const v23Steps=[
 {name:'대본 구성 Agent',running:['script_agent_running'],done:['script_agent']},
 {name:'음성 생성(TTS) Agent',running:['tts_agent_running'],done:['tts_agent']},
 {name:'디지털 트윈 개인화 Agent',running:['video_production_agent_running'],done:['video_production_agent']},
 {name:'최종 영상 합성 Agent',running:['composition_agent_running'],done:['composition_agent']}
];
const legacySteps=[
 {name:'입력·안전성 확인',running:['context_agent'],done:['safety_agent']},
 {name:'대본 구성 Agent',running:['script_agent'],done:['visual_asset_agent']},
 {name:'디지털 트윈 제작',running:['base_render_agent_running'],done:['base_render_agent']},
 {name:'음성 생성(TTS)',running:['tts_agent_running'],done:['tts_agent']},
 {name:'최종 영상 합성',running:['composition_agent_running'],done:['composition_agent','final_report_agent']}
];
function renderSteps(workflow,stage,status){const steps=workflow==='v23'?v23Steps:legacySteps,complete=status==='DONE'||stage==='completed';return steps.map(step=>{const active=step.running.includes(stage),exactDone=step.done.includes(stage);const index=steps.indexOf(step),current=steps.findIndex(x=>x.running.includes(stage)||x.done.includes(stage));const done=complete||exactDone||(current>=0&&index<current);const state=done?'done':active?'active':'';const mark=done?'✓ ':active?'● ':'○ ';const suffix=done?' 완료':active?' 실행 중':'';return `<div class="step ${state}">${mark}${step.name}${suffix}</div>`}).join('')}
async function openJob(id){openJobId=id;logOffsets={};logBuffers={};$('#jobModal').classList.add('open');$('#jobLog').textContent='로그를 불러오는 중입니다…';clearTimeout(logTimer);await pollJobDetail()}
async function pollJobDetail(){if(!openJobId)return;const done=await refreshJobDetail();await refreshJobLog();if(!done&&openJobId)logTimer=setTimeout(pollJobDetail,2000);else logTimer=null}
async function refreshJobDetail(){if(!openJobId)return true;try{const r=await fetch(`/api/production-jobs/${openJobId}/detail`);if(!r.ok)throw new Error(await r.text());const d=await r.json(),j=d.productionJob,w=d.worker||{},pd=w.progress_detail||{};$('#jobTitle').textContent=`영상 제작 상세 — ${j.alert.stationName}`;const cache=w.cache==='HIT'?(w.workflow_version==='v23'?'사전 렌더 자산 사용':'원본 영상 재사용'):w.cache==='MISS'?'신규 렌더링':'확인 중';const frame=pd.frame?`${pd.frame} / ${pd.total_frames||1248}`:'-';$('#jobDetail').innerHTML=`<div class="job-summary"><div>상태<b>${w.status||j.status}</b></div><div>현재 단계<b>${w.message||j.message}</b></div><div>실제 실행 시간<b>${Math.floor((w.elapsed_seconds||0)/60)}분 ${(w.elapsed_seconds||0)%60}초</b></div><div>Worker<b>${w.active_process?.running?'실행 중':'대기 또는 종료'}</b></div><div>디지털 트윈 자산<b>${cache}</b></div><div>합성 프레임<b>${frame}</b></div><div>진행률<b>${w.progress??j.progress}%</b></div><div>마지막 갱신<b>${fmtTime(w.updated_at||j.updatedAt)}</b></div></div>${w.error?`<div class="error">${w.error}</div>`:''}<div class="steps">${renderSteps(w.workflow_version,w.stage,w.status)}</div>`;return terminal(j)}catch(e){if(!terminal(latestJob))$('#jobDetail').innerHTML=`<div class="error">${e.message}</div>`;return terminal(latestJob)}}
async function refreshJobLog(){if(!openJobId)return;try{const after=logOffsets[logSource]||0,r=await fetch(`/api/production-jobs/${openJobId}/logs?source=${logSource}&after=${after}`);if(!r.ok)throw new Error(await r.text());const data=await r.json(),box=$('#jobLog');logOffsets[logSource]=data.next||after;logBuffers[logSource]=((logBuffers[logSource]||'')+(data.text||'')).slice(-200000);box.textContent=logBuffers[logSource]||'아직 기록된 로그가 없습니다.';box.scrollTop=box.scrollHeight}catch(e){$('#jobLog').textContent=e.message}}
function closeJob(){openJobId=null;clearTimeout(logTimer);logTimer=null;$('#jobModal').classList.remove('open')}
const events=new EventSource('/api/notifications/stream');events.addEventListener('flood-alert',()=>{loadAlerts();startPipelinePolling()});
$('#district').onchange=loadStations;$('#search').oninput=renderList;$('#reload').onclick=loadStations;$('#showAlerts').onclick=()=>{$('#alertModal').classList.add('open');loadAlerts()};$('#closeModal').onclick=()=>$('#alertModal').classList.remove('open');$('#alertModal').onclick=e=>{if(e.target.id==='alertModal')e.currentTarget.classList.remove('open')};$('#closeJobModal').onclick=closeJob;$('#jobModal').onclick=e=>{if(e.target.id==='jobModal')closeJob()};document.querySelectorAll('[data-log]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-log]').forEach(x=>x.classList.remove('active'));b.classList.add('active');logSource=b.dataset.log;refreshJobLog()});$('#copyLog').onclick=()=>navigator.clipboard.writeText($('#jobLog').textContent);loadStations();loadAlerts();startPipelinePolling();
</script>
</body></html>

<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>경고 영상 Agent 확인</title><style>
:root{font-family:"Noto Sans KR",system-ui,sans-serif;color:#173329;background:#edf4f0}*{box-sizing:border-box}body{margin:0}.wrap{max-width:820px;margin:42px auto;padding:20px}h1{margin-bottom:6px}.muted{color:#667a71}.card{background:white;border:1px solid #d9e7df;border-radius:16px;padding:24px;margin-top:22px;box-shadow:0 12px 35px #17332912}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-weight:700}input{width:100%;height:44px;margin-top:7px;border:1px solid #c7d7cf;border-radius:9px;padding:0 12px}button{height:46px;padding:0 20px;border:0;border-radius:9px;background:#176b43;color:white;font-weight:800;cursor:pointer;margin-top:18px}.flow{display:flex;align-items:center;gap:8px;margin:22px 0}.step{flex:1;padding:12px;text-align:center;background:#f0f5f2;border-radius:9px}.active{background:#d8f1e3;color:#125f38;font-weight:800}.failed{background:#ffe5e5;color:#a52222}.arrow{color:#8ba096}video{width:100%;margin-top:16px;border-radius:10px;background:#111}.error{white-space:pre-wrap;color:#a52222}@media(max-width:600px){.grid{grid-template-columns:1fr}.flow{flex-direction:column}.arrow{transform:rotate(90deg)}}
</style></head><body><main class="wrap"><h1>경고 영상 멀티에이전트</h1><div class="muted">녹화 완료 이후의 실행 흐름을 임시로 확인하는 화면입니다.</div>
<section class="card"><form id="form"><div class="grid"><label>사용자 위치<input name="location" value="○○리" required></label><label>사용자 이름<input name="farmer_name" value="김○○" required></label></div><label style="margin-top:14px">디지털 트윈 녹화 영상<input name="video" type="file" accept="video/*" required></label><button>Agent 실행</button> <button id="previewButton" type="button" style="background:#fff;color:#176b43;border:1px solid #176b43">API 없이 검증</button></form></section>
<section id="result" class="card" hidden><div class="flow"><div data-step="SCRIPT" class="step">대본 생성</div><span class="arrow">→</span><div data-step="TTS" class="step">TTS</div><span class="arrow">→</span><div data-step="VIDEO" class="step">영상 제작</div></div><strong id="message"></strong><p id="error" class="error"></p><video id="video" controls hidden></video></section></main>
<section id="preview" class="card" style="display:none"><h2>Dry-run 검증 결과</h2><div id="summary" class="muted"></div><h3>StateGraph 실행 로그</h3><ol id="graphLogs"></ol><div style="overflow:auto"><table style="width:100%;border-collapse:collapse;margin-top:14px"><thead><tr><th>#</th><th>예상 시간</th><th>TTS가 읽는 문장</th><th>자막</th></tr></thead><tbody id="timeline"></tbody></table></div><h3>FFmpeg 명령</h3><pre id="command" style="white-space:pre-wrap;background:#15251e;color:#dff2e8;padding:14px;border-radius:9px"></pre></section>
<script>
const form=document.querySelector('#form'),result=document.querySelector('#result'),message=document.querySelector('#message'),error=document.querySelector('#error'),player=document.querySelector('#video'),preview=document.querySelector('#preview');
form.onsubmit=async e=>{e.preventDefault();result.hidden=false;error.textContent='';player.hidden=true;setStep('QUEUED');message.textContent='업로드 중';const r=await fetch('/api/jobs',{method:'POST',body:new FormData(form)});if(!r.ok){error.textContent=await r.text();return}poll((await r.json()).job_id)};
function setStep(status){document.querySelectorAll('.step').forEach(x=>{x.className='step';if(['SCRIPT','TTS','VIDEO','DONE'].indexOf(status)>=['SCRIPT','TTS','VIDEO'].indexOf(x.dataset.step))x.classList.add('active');if(status==='FAILED')x.classList.add('failed')})}
async function poll(id){const r=await fetch('/api/jobs/'+id),job=await r.json();setStep(job.status);message.textContent=job.message;error.textContent=job.error||'';if(job.status==='DONE'){player.src=job.result_url;player.hidden=false;return}if(job.status!=='FAILED')setTimeout(()=>poll(id),1000)}
document.querySelector('#previewButton').onclick=async()=>{const data=new FormData(form),q=new URLSearchParams({location:data.get('location'),farmer_name:data.get('farmer_name')}),plan=await (await fetch('/api/preview?'+q)).json();preview.style.display='block';document.querySelector('#summary').textContent=`API 호출 없음 · 예상 총 길이 ${plan.total_seconds.toFixed(1)}초 · 실제 TTS 생성 후 시간은 달라질 수 있습니다.`;document.querySelector('#graphLogs').innerHTML=plan.logs.map(x=>`<li>${x}</li>`).join('');document.querySelector('#timeline').innerHTML=plan.timeline.map(x=>`<tr style="vertical-align:top"><td style="padding:9px;border-top:1px solid #ddd">${x.index}</td><td style="padding:9px;border-top:1px solid #ddd;white-space:nowrap">${x.start_seconds.toFixed(1)}–${x.end_seconds.toFixed(1)}초</td><td style="padding:9px;border-top:1px solid #ddd">${x.narration??'<b>읽지 않음</b>'}</td><td style="padding:9px;border-top:1px solid #ddd;white-space:pre-line">${x.subtitle}</td></tr>`).join('');document.querySelector('#command').textContent=plan.ffmpeg_command.join(' ')};
</script></body></html>
